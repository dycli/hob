# On a version tag (v1.2.3): build static Linux binaries for x86-64 and
# aarch64 (a Raspberry Pi), attach them to a GitHub release, and publish the
# container image for both to the GitHub Container Registry as
# ghcr.io/<owner>/hob:<version> and :latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload its binaries
  packages: write   # push the image to GHCR

jobs:
  binaries:
    strategy:
      matrix:
        include:
          # Each builds natively on its own architecture's runner, so musl's
          # own gcc wrapper compiles the C parts (ring, for TLS).
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for the target
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build a static binary
        env:
          CC: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=hob-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/hob README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: hob-*.tar.gz*

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" hob-*.tar.gz* --repo "$GITHUB_REPOSITORY" --generate-notes

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # QEMU lets one runner build the aarch64 image beside the x86-64 one.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hob
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
